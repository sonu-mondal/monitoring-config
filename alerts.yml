groups:
  - name: node-memory-alerts
    rules:
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 5
        for: 2m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "High Memory Usage on {{ $labels.instance }}"
          description: "Memory usage is above 5% for more than 2 minutes."
